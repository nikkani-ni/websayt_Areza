<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven | Gallery</title>

  <script>location.replace("index.html#gallery");</script>
  <noscript><meta http-equiv="refresh" content="0; url=index.html#gallery"></noscript>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/gallery.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <main>

    <section class="gallery-section" id="gallery">

      <div class="gallery-panel">

        <div class="gallery-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 19C5 10 10 5 20 4c0 10-5 15-14 15z"></path>
            <path d="M5 19c3-5 6-8 11-11"></path>
          </svg>
          <h2>Gallery</h2>
        </div>

        <div class="gallery-body">

          <div class="gallery-follow">
            <span>Follow us</span>

            <div class="social-icons">
              <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                  <circle cx="12" cy="12" r="4"></circle>
                  <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"></circle>
                </svg>
              </a>

              <a href="#" aria-label="Facebook">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                  <path d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4.5 1.8-4.5 4.5V8H7v3.5h2.5V22H14V11.5h2.8L17 8z"></path>
                </svg>
              </a>

              <a href="#" aria-label="Pinterest"><b class="social-letter">P</b></a>

              <a href="#" aria-label="YouTube">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                  <rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect>
                  <path d="M10 9.5v5l4.5-2.5z" fill="currentColor"></path>
                </svg>
              </a>
            </div>
          </div>


          <div class="gallery-photos">

            <div class="photo photo-tall">
              <img src="../images/gallery1.png" alt="Wooden bedroom with forest view">
            </div>

            <div class="photo-rows">

              <div class="photo-row row-top">
                <div class="photo">
                  <img src="../images/gallery2.png" alt="Infinity pool overlooking the valley">
                </div>
                <div class="photo">
                  <img src="../images/gallery3.png" alt="Grass roof cabin by the pool">
                </div>
              </div>

              <div class="photo-row row-bottom">
                <div class="photo">
                  <img src="../images/gallery4.png" alt="Cozy living room with arched windows">
                </div>
                <div class="photo">
                  <img src="../images/gallery5.png" alt="Interior with a large window">
                </div>
              </div>

            </div>

          </div>

          <p class="gallery-caption">
            Moments of<br>
            calm, captured<br>
            in nature.
          </p>

        </div>

        <a href="#gallery" class="more-photos-btn">See More Photos</a>

      </div>

    </section>

  </main>

</body>
</html>
